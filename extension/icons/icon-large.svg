<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Callslip: a library call slip, stamped with a seal that carries the download
       arrow. The seal is the stamped pass of the journey 取经 is named after.
       Used at 48px and above. -->
  <rect width="64" height="64" rx="14" fill="#1f5c4a"/>
  <g transform="rotate(-8 32 32)">
    <!-- the slip -->
    <rect x="15.5" y="7" width="33" height="50" rx="3.2" fill="#fffdf8"/>
    <!-- its tear-off stub: a bite out of each edge and a dotted line between -->
    <circle cx="15.5" cy="20.5" r="2.6" fill="#1f5c4a"/>
    <circle cx="48.5" cy="20.5" r="2.6" fill="#1f5c4a"/>
    <path d="M21 20.5 H43" stroke="#1f5c4a" stroke-opacity=".42" stroke-width="1.3" stroke-dasharray="1.7 2.4" stroke-linecap="round"/>
    <path d="M21 14 H31" stroke="#8fbba8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- what was asked for -->
    <path d="M21 28 H43 M21 34 H43 M21 40 H26.5" stroke="#1f5c4a" stroke-width="2.2" stroke-linecap="round"/>
    <!-- the seal, pressed on a little askew: the paper is on its way down -->
    <g transform="rotate(9 38.5 45.5)">
      <rect x="29.8" y="36.8" width="17.4" height="17.4" rx="2.8" fill="#c8452f"/>
      <rect x="31.5" y="38.5" width="14" height="14" rx="1.6" fill="none" stroke="#fffdf8" stroke-opacity=".55" stroke-width=".8"/>
      <path d="M38.5 41.2 V49.6 M35 46.3 L38.5 49.9 L42 46.3" fill="none" stroke="#fffdf8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
